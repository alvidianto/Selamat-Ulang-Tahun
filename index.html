<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="stars"></canvas>



<!-- =========================
     LOADING
========================= -->

<section id="loading" class="scene active">

    <h1>AURORA</h1>

    <div class="loading">

        <div id="progress"></div>

    </div>

    <p id="loadingText">
        Initializing...
    </p>

</section>





<!-- =========================
     METEOR
========================= -->

<section id="meteorScene" class="scene">


    <div class="meteor"></div>
    <div class="meteor second"></div>


    <h1>
        Something special is coming...
    </h1>


</section>





<!-- =========================
     CAKE
========================= -->

<section id="cakeScene" class="scene">


    <div class="cake">

        <div id="flame">
            🔥
        </div>

        🎂

    </div>


    <h1>
        HAPPY BIRTHDAY
    </h1>


    <h2>
        Zahra
    </h2>


    <p id="message"></p>


    <button id="blow">

        Tiup Lilin 🕯️

    </button>


</section>





<!-- =========================
     ENDING
========================= -->

<section id="ending" class="scene">


    <div class="fireworks">
        ✨ 🎆 ✨
    </div>


    <h1>
        HAPPY BIRTHDAY 🎉
    </h1>


</section>




<script src="script.js"></script>


</body>

</html>
